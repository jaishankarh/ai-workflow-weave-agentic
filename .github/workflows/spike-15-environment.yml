name: spike-15-environment

# Runs the Environment spike (issue #15) on a GitHub-hosted runner: a full,
# throwaway Ubuntu VM with sudo and KVM, so sysbox can be installed and the
# emulator gets hardware acceleration. Posts the results on issue #15.
on:
  push:
    branches: [spike/15-environment]
    paths:
      - "wayfinder/spikes/15-environment/**"
      - ".github/workflows/spike-15-environment.yml"
  workflow_dispatch:
    inputs:
      rn_app_repo:
        description: "Optional owner/repo of a real React Native app to also time (public, or readable by this token)"
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: spike-15
  cancel-in-progress: true

jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: wayfinder/spikes/15-environment
    steps:
      - uses: actions/checkout@v4

      - name: Free disk (the sandbox image is ~10 GB)
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null || true
          df -h / | tail -1

      - name: Host facts
        run: |
          nproc; free -g | head -2; uname -r
          grep -m1 -oE 'vmx|svm' /proc/cpuinfo || echo "no virt flags"
          ls -l /dev/kvm || true

      - name: Make /dev/kvm world read-write (sysbox maps devices to nobody:nogroup)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-spike.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install sysbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R nestybox/sysbox --pattern '*linux_amd64.deb' -D /tmp/sysbox
          sudo apt-get update -qq
          sudo apt-get install -y jq /tmp/sysbox/*.deb
          docker info --format '{{json .Runtimes}}'
          sysbox-runc --version

      - name: Build sandbox image
        run: |
          docker pull -q ghcr.io/openhands/agent-server:latest-python
          RUNTIME_USER=$(docker inspect --format '{{.Config.User}}' ghcr.io/openhands/agent-server:latest-python)
          echo "agent-server runs as: ${RUNTIME_USER:-root}"
          docker build -q --build-arg RUNTIME_USER=${RUNTIME_USER:-root} -t weave-spike-environment .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenHands SDK
        run: pip install -q openhands-sdk==1.51.0 openhands-workspace==1.51.0

      - name: Run spike (sample app)
        continue-on-error: true
        run: python spike.py

      - name: Run spike (real app)
        if: ${{ inputs.rn_app_repo != '' && inputs.rn_app_repo != null }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv results-sysbox-runc.json results-sample.json; mv proof-sysbox-runc.png proof-sample.png || true
          gh repo clone "${{ inputs.rn_app_repo }}" /tmp/rn-app -- --depth 1
          python spike.py --rn-app /tmp/rn-app
          mv results-sysbox-runc.json results-real-app.json; mv proof-sysbox-runc.png proof-real-app.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-15-results
          path: |
            wayfinder/spikes/15-environment/results-*.json
            wayfinder/spikes/15-environment/proof-*.png

      - name: Post results on the ticket
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## Spike run on a GitHub-hosted runner"
            echo
            echo "Run: $RUN_URL (screenshot and full results in the \`spike-15-results\` artifact). Commit \`${GITHUB_SHA::7}\`."
            for f in results-*.json; do
              [ -f "$f" ] || continue
              echo
              echo "### \`$f\` summary"
              echo '```json'
              jq '{runtime, fatal, checks: (.checks | map_values({ok, seconds} + (if .ok == false then {output_tail} else {} end)))}' "$f" | cut -c1-400
              echo '```'
              echo
              echo "<details><summary>Full $f</summary>"
              echo
              echo '```json'
              jq 'del(.traceback)' "$f" | head -c 50000
              echo '```'
              echo "</details>"
            done
            ls results-*.json >/dev/null 2>&1 || echo "No results file was written; see the run log."
          } > /tmp/comment.md
          gh issue comment 15 -R "${{ github.repository }}" --body-file /tmp/comment.md
