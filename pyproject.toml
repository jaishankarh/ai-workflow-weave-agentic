[project]
name = "workflow-weave"
version = "0.1.0"
description = "Developer workflow as an executable graph: agent workers, dispatcher and adapters."
requires-python = ">=3.12"
dependencies = [
    "openhands-sdk==1.53.0",
    "openhands-workspace==1.53.0",
    "openhands-tools==1.53.0",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_weave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
