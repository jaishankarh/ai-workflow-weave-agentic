# One Product's Test secrets (CONTEXT.md): credentials for test accounts and sandboxes of outside
# services, never staging or production. Copy to `<test_secrets.location>/<product>.yaml` from
# weave.yaml (e.g. ~/.config/weave/secrets/ahdismoi.yaml) on the Sandbox host, outside every repo,
# and `chmod 600` it: a file others can read is refused. Never commit real values.
#
# A flat `NAME: value` mapping. A Repo's Run recipe names the secrets it needs by name only
# (`x-weave.secrets: [KORONA_API_KEY]`); a run is given just those, in the environment of that
# Repo's services, and never the whole set. A named secret missing here stops the run as
# `needs-setup` naming the Repo and the secret. A throwaway database's own credentials do not
# belong here: they live in the committed recipe.
KORONA_API_KEY: kor-test-REPLACE-ME
KORONA_TEST_BUSINESS_ID: REPLACE-ME
